<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست تلگرام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 28px; margin-bottom: 20px; }
    .box {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      max-width: 320px;
      width: 100%;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 12px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>تست مینی‌اپ</h1>
    <p id="message">در حال اتصال به تلگرام...</p>
    <button onclick="sendData()">ارسال تست</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const message = document.getElementById('message');

    if (tg.initDataUnsafe?.user) {
      const user = tg.initDataUnsafe.user;
      message.innerHTML = `
        وصل شدیم ✅<br><br>
        نام: ${user.first_name || '-'}<br>
        آیدی: ${user.id}
      `;
    } else {
      message.innerText = 'خارج از تلگرام باز شده (نرمال برای تست مرورگر)';
    }

    function sendData() {
      tg.showAlert('دکمه کار می‌کنه!');
      tg.HapticFeedback.impactOccurred('medium');
    }
  </script>
</body>
</html>
