<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .info {
      font-size: 18px;
      margin-bottom: 30px;
      color: #94a3b8;
    }
    #score {
      font-size: 64px;
      font-weight: bold;
      color: #38bdf8;
      margin: 20px 0;
    }
    #timer {
      font-size: 22px;
      margin-bottom: 30px;
    }
    #tapBtn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border: none;
      color: white;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #tapBtn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }
    #tapBtn:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-row {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }
    .small-btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>⚡ Fast Tap</h1>
  <div class="info" id="userInfo">در حال اتصال...</div>

  <div id="score">0</div>
  <div id="timer">زمان: ۱۰</div>

  <button id="tapBtn">شروع</button>

  <div class="btn-row hidden" id="endBtns">
    <button class="small-btn" id="restartBtn">بازی دوباره</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0f172a');
    tg.setBackgroundColor('#0f172a');

    // نمایش اطلاعات کاربر
    const userInfo = document.getElementById('userInfo');
    if (tg.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      userInfo.innerText = `سلام ${u.first_name || 'بازیکن'} 👋`;
    } else {
      userInfo.innerText = 'حالت تست مرورگر';
    }

    let score = 0;
    let timeLeft = 10;
    let isPlaying = false;
    let timerInterval = null;

    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const tapBtn = document.getElementById('tapBtn');
    const endBtns = document.getElementById('endBtns');
    const restartBtn = document.getElementById('restartBtn');

    function startGame() {
      score = 0;
      timeLeft = 10;
      isPlaying = true;
      scoreEl.innerText = score;
      timerEl.innerText = `زمان: ${timeLeft}`;
      tapBtn.innerText = 'بزن!';
      tapBtn.disabled = false;
      endBtns.classList.add('hidden');

      // ویبره شروع
      try { tg.HapticFeedback.impactOccurred('medium'); } catch(e) {}

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `زمان: ${timeLeft}`;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      tapBtn.disabled = true;
      tapBtn.innerText = 'تمام!';
      endBtns.classList.remove('hidden');

      // نمایش نتیجه
      tg.showAlert(`آفرین!\nامتیاز تو: ${score}`);
      try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
    }

    // کلیک روی دکمه اصلی
    tapBtn.addEventListener('click', () => {
      if (!isPlaying) {
        startGame();
        return;
      }

      score++;
      scoreEl.innerText = score;

      // ویبره کوچک
      try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
    });

    // دکمه شروع دوباره
    restartBtn.addEventListener('click', () => {
      startGame();
    });

    // دکمه اصلی تلگرام (اختیاری)
    tg.MainButton.setText('شروع دوباره');
    tg.MainButton.hide();
  </script>
</body>
</html>
